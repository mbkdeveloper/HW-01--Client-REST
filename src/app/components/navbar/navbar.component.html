<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm py-2">
  <div class="container-fluid px-4">
    <!-- Brand -->
    <a class="navbar-brand d-flex align-items-center gap-2 fw-bold" routerLink="/produits">
      <i class="bi bi-box-seam-fill fs-4"></i>
      <span>Gestion des Produits</span>
    </a>

    <!-- Mobile Toggler -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent"
      aria-controls="navbarContent" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navigation links & actions -->
    <div class="collapse navbar-collapse" id="navbarContent">

      <!-- Format selector (JSON / XML) and API health indicator -->
      <div class="d-flex align-items-center flex-wrap gap-3 ms-auto">
        <!-- Sélecteur de format JSON / XML -->
        <div
          class="format-toggle d-flex align-items-center bg-white bg-opacity-10 rounded-pill p-1 border border-light border-opacity-25">
          <span class="text-white-50 small px-2 fw-semibold">Format :</span>
          <button type="button" class="btn btn-sm rounded-pill px-3 py-1 fw-bold transition-all"
            [class.btn-light]="currentFormat === 'JSON'" [class.btn-outline-light]="currentFormat !== 'JSON'"
            (click)="toggleFormat('JSON')">
            <i class="bi bi-braces me-1"></i>JSON
          </button>
          <button type="button" class="btn btn-sm rounded-pill px-3 py-1 fw-bold transition-all ms-1"
            [class.btn-warning]="currentFormat === 'XML'" [class.text-dark]="currentFormat === 'XML'"
            [class.btn-outline-light]="currentFormat !== 'XML'" (click)="toggleFormat('XML')">
            <i class="bi bi-code-slash me-1"></i>XML
          </button>
        </div>
      </div>
    </div>
